name: Pull Request

on:
  pull_request:
    branches:
      - candidate
    paths:
      - "snap/**"
      - ".github/**"
      - "test/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test Snap (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: 🧪 Build snap
        uses: snapcrafters/ci/test-snap-build@main

      - name: Setup LXD
        uses: canonical/setup-lxd@d14f946da89caa319fd083d39b1960f4978fb982

      - name: Test snap
        run: |
          sudo usermod -aG lxd $USER
          newgrp lxd
          snapcraft test --verbosity trace || cat /home/runner/.local/state/snapcraft/log/snapc*.log
